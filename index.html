<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MathSphere AI</title>
<style>

body{
    margin:0;
    font-family:Arial,sans-serif;

}

.container{

.gradeLink{

    border-radius:16px;
    padding:20px;

    transition:transform .15s;
}

.gradeLink:active{
    transform:scale(0.98);
}

.grade6{

    color:#2854a3;

.grade8{
    background:#f2ecff;
    color:#5b2ca3;

.gradeLink .title{

</style>
</head>

<div class="container">
